<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Space+Grotesk:wght@700&family=Pinyon+Script&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
  <title>Contacto — MAIGEL</title>
</head>

<body data-page="contact">

  <header class="nav" id="site-nav"></header>

  <main class="inner">

    <section class="page-head">
      <div class="container">
        <h1 class="page-title">Contacto</h1>
      </div>
    </section>

    <!-- =========================================
         DATOS DE CONTACTO
         ✏️ El email, el Instagram y la web NO se cambian aquí:
            se cambian una sola vez en js/site.js y se actualizan en toda la web.
    ========================================== -->
    <section id="datos">
      <div class="container split">
        <h2 class="section-label">DATOS</h2>
        <div>
          <div class="contact-row">
            <span class="entry-date">Email</span>
            <a data-site="email" href="#">maigel@email.com</a>
          </div>
          <div class="contact-row">
            <span class="entry-date">Instagram</span>
            <span data-site="instagram">@maigel</span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="js/site.js"></script>
</body>
</html>
